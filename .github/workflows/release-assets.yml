name: Release Assets

# REMINDER (v2.8.0 WS4): before tagging, confirm tests/offline-smoke-test.md's timing
# scorecard has been refreshed for this release (see CONTRIBUTING.md §Pre-release
# checklist). This workflow does not and cannot enforce that automatically — it is a
# maintainer step, not a CI gate — but a tag pushed without a current scorecard means
# the README "15 minutes" claim is shipping unverified for this release.
#
# ADR-079 (v2.19.7): this workflow is narrowed to VERIFICATION-ONLY. It used to build its
# own archives and attach them via a third-party upload Action — a two-step design in
# which this job and scripts/publish-release.sh disagreed about who owns the Release
# (CF-v2.19.6-A: softprops took a create path when no Release existed and an UPDATE path
# when publish-release.sh had already pre-created one, and the update path 403'd). A1
# resolved that: publish-release.sh now attaches both archives itself, on every branch,
# before any tag push. This job's remaining job is DETECTION, not prevention — it
# downloads the PUBLISHED asset and re-asserts the same DROP/KEEP content rules against
# the bytes GitHub actually serves, so a divergence between "what was asserted before
# upload" and "what the public actually gets" becomes a detected event rather than a
# silent premise (ADR-079 decision 3(b); docs/design-v2.19.7.md §B).
#
# permissions below is narrowed to read-only (it previously granted a write scope) — this
# workflow issues no `gh release upload`/`create`/`edit` call anywhere below. This converts
# "this workflow no longer writes" from a behavioural claim into a STRUCTURAL one
# (AC-A1-2a): the token cannot upload or edit a Release even if a future edit
# reintroduced a step that tried.
#
# The `push: tags` trigger is RETAINED — :19 below records it as the deliberate net for
# anyone who tags with a plain `git push` rather than scripts/publish-release.sh.
# Verification makes no write API call, so it cannot reintroduce the 403 this workflow
# used to cause.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify-published-assets:
    name: Verify published release assets (detection)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Verify a populated Release already exists for this tag
        # ADR-076 D2: fail-closed precondition, retained from before A1. This is a READ
        # (`gh release view`), not a write — it never attempted to create anything, so it
        # is unaffected by the softprops removal above. Failure here means
        # scripts/publish-release.sh was never run before the tag was pushed (e.g. a
        # plain `git push --tags`) — the loud, actionable signal this step exists to give.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"

          if ! BODY="$(gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" --json body -q '.body' 2>/dev/null)"; then
            echo "::error::No GitHub Release exists for tag ${TAG}. Run 'scripts/publish-release.sh' BEFORE pushing a tag — it creates the tag, a populated Release, AND attaches both release archives, all before any tag push (ADR-079)."
            exit 1
          fi

          if [ -z "$BODY" ] || [ "$BODY" = "null" ]; then
            echo "::error::Release ${TAG} exists but has an empty body. Run 'scripts/publish-release.sh ${TAG#v}' to populate it from CHANGELOG.md."
            exit 1
          fi

          echo "Precondition PASSED — Release ${TAG} exists with a non-empty body."

      - name: Download published assets and verify DROP/KEEP content (detection)
        # ADR-079 decision 3(b) / docs/spec.md AC-A1-2b. Downloads the archives GitHub
        # actually serves for this Release and re-runs the SAME shared assertion
        # (scripts/release-archive-assert.sh — single-sourced DROP/KEEP lists, AC-A1-4)
        # that scripts/publish-release.sh already ran, pre-upload, against the exact
        # bytes it was about to attach. A divergence between the two means something
        # altered the Release's assets after publish-release.sh ran — a detected event,
        # not a silent premise (the "the two archives should be byte-identical" assumption
        # class that produced every finding in the last two cycles).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          PREFIX="cowork-starter-kit-${VERSION}/"
          DOWNLOAD_DIR="$(mktemp -d)"

          gh release download "$TAG" --repo "${GITHUB_REPOSITORY}" \
            --pattern "cowork-starter-kit-*.zip" \
            --pattern "cowork-starter-kit-*.tar.gz" \
            --dir "$DOWNLOAD_DIR"

          ZIP_FILE="${DOWNLOAD_DIR}/cowork-starter-kit-${VERSION}.zip"
          TARGZ_FILE="${DOWNLOAD_DIR}/cowork-starter-kit-${VERSION}.tar.gz"

          if [ ! -f "$ZIP_FILE" ] || [ ! -f "$TARGZ_FILE" ]; then
            echo "::error::expected both cowork-starter-kit-${VERSION}.zip and .tar.gz to be attached to ${TAG} — found: $(ls "$DOWNLOAD_DIR")"
            exit 1
          fi

          bash scripts/release-archive-assert.sh "$ZIP_FILE" "$PREFIX"
          bash scripts/release-archive-assert.sh "$TARGZ_FILE" "$PREFIX"

          echo "verify-published-assets PASSED — both published archives match the DROP/KEEP content rules."
